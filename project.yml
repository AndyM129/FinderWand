name: FinderWand
options:
  bundleIdPrefix: io.github.andym129
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 构建配置：Debug 对应开发版，Release 对应正式版
configs:
  Debug: debug
  Release: release

targets:
  FinderWand:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      - path: Sources/Assets.xcassets
      # 新建插件用的模板文件夹，作为文件夹引用整体打入 App 资源，保留目录结构
      - path: Resources/TemplatePlugin
        type: folder
        buildPhase: resources
    # 按配置分别引入 xcconfig，区分 Dev 版与正式版
    configFiles:
      Debug: Configs/Dev.xcconfig
      Release: Configs/Release.xcconfig
    # 嵌入 Finder Sync 扩展（appex 放入 Contents/PlugIns）
    dependencies:
      - target: FinderWandSync
        embed: true

  # Finder Sync 扩展（沙箱 appex）
  FinderWandSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSyncExtension
      - path: Shared
    info:
      path: FinderSyncExtension/Info.plist
      properties:
        # 显示名按配置区分（dev / 正式），避免系统「登录项与扩展」里混淆
        CFBundleDisplayName: $(FW_EXT_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderSyncExtension/FinderWandSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        # 版本号需与主 App 保持一致（CI 打包时由 xcodebuild 统一覆盖）
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # 无付费账号：ad-hoc 签名，不强制签名
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.andym129.dev.finder-wand.FinderSync
          # 开发版扩展显示名
          FW_EXT_DISPLAY_NAME: Finder Wand Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.andym129.finder-wand.FinderSync
          # 正式版扩展显示名
          FW_EXT_DISPLAY_NAME: Finder Wand

schemes:
  FinderWand:
    build:
      targets:
        FinderWand: all
    run:
      config: Debug
    archive:
      config: Release
